<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FGUARD — Set password</title>
  <link rel="icon" type="image/png" href="/static/img/fguard-shield.png">
  <link rel="stylesheet" href="/static/css/aegis.css?v={{ app_version }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap { width: 100%; max-width: 420px; padding: 24px; }
    .card h2 { font-size: 16px; margin-bottom: 8px; }
    .hint { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; line-height: 1.45; }
    .error {
      background: rgba(192,57,43,0.15);
      border: 1px solid rgba(192,57,43,0.4);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: #e74c3c;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="card">
      <h2>Set the administrator password</h2>
      <p class="hint">The factory password only opens this page. Choose a new one before managing the firewall.</p>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/account/password">
        <div class="form-group">
          <label class="form-label">Current password</label>
          <input class="form-control" type="password" name="current_password" autocomplete="current-password" required>
        </div>
        <div class="form-group">
          <label class="form-label">New password</label>
          <input class="form-control" type="password" name="new_password" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm new password</label>
          <input class="form-control" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Save and continue</button>
      </form>
      <form method="POST" action="/logout" style="margin-top:10px">
        <button type="submit" class="btn btn-secondary" style="width:100%">Sign out</button>
      </form>
    </div>
  </div>
</body>
</html>
