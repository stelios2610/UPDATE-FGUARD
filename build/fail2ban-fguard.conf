# FGUARD fail2ban configuration
# Place in /etc/fail2ban/jail.d/fguard.conf

[sshd]
enabled  = true
port     = ssh
maxretry = 5
bantime  = 3600
findtime = 600

[fguard-vpn]
enabled   = true
filter    = fguard-vpn
logpath   = /var/log/fguard-ssl-vpn.log
maxretry  = 5
bantime   = 3600
findtime  = 300
action    = iptables-multiport[name=VPN, port="1194", protocol=udp]
