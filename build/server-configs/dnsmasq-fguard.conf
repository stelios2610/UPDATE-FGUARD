# FGUARD DHCP config (dnsmasq)
# Listen only on LAN interface to avoid conflict with systemd-resolved
listen-address=10.0.0.1
bind-interfaces
no-resolv
no-poll
bogus-priv
domain-needed
server=1.1.1.1
server=8.8.8.8
local=/aegis.local/
domain=aegis.local
interface=eth1
dhcp-range=eth1,10.0.0.100,10.0.0.200,255.255.255.0,86400s
dhcp-option=eth1,3,10.0.0.1
dhcp-option=eth1,6,10.0.0.1
